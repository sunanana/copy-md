<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>copy-md</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>API キーが設定されていません</h1>
    <p>
      このページの Markdown 化には Jina AI Reader を使うため、API キーが必要です。
      設定画面でキーを保存すると、アイコンのクリックだけでコピーできるようになります。
    </p>
    <p class="note">
      Qiita / esa の記事ページはキーなしでもそのままコピーできます。
    </p>
    <button id="open-options" type="button">設定を開く</button>
    <p class="note">
      キーは <a href="https://jina.ai/" target="_blank" rel="noreferrer">https://jina.ai/</a> で取得できます。
      設定画面は拡張アイコンの右クリックメニュー「オプション」からも開けます。
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
